<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Scope Pollution</title>
</head>
<body>
    //do not ever pollute global scope, to make sure u dont , use "use strict"
    <script>
        // "use strict"

        //problem of scope pollution
        b = 15;
        function abc(){
            console.log(b);
            let c = "Hello World";
            b ++;
            
        }

        abc();
        // console.log("c is ",c);
        b++;
        console.log(b);

    </script>
</body>
</html>
