<!-- start , reset . when countdown is started,the start btn would change to pause button . if user enters sec > 60 , those extraseconds would be converted to minutes hours . 3750 sec -> 1 hour 2min 30 sec

must have features
1. pass time in hours, minutes ,seconds
2. play pause btn
3. if sec > 60 , convert and show in hours, minutes, seconds

approach

input -> 3750 sec -> 1 hour 2min 30 sec
start -> countdown should be started -> setInterval -> every 1 second -> decrement the time -> update the UI -> if time is 0 , stop the countdown -> show the time is up
start-> pause -->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Countdown Timer</h1>
        <div class="timer_label">
            <h2 class="timer_label_hrs">Hours</h2>
            <h2 class="timer_label_min">Minutes</h2>
            <h2 class="timer_label_sec">Seconds</h2>
        </div>
        <div class="timer_inputs">
            <input type="number" maxlength="2" oninput ="this.value=this.value.slice(0,this.maxlength)" id="hr" placeholder="00">
            <input type="number" maxlength="2" id="min" placeholder="00">
            <input type="number" maxlength="2" id="sec" placeholder="00">
        </div>
        <div class="container_btns">
            <button class="btn" id="start">Start</button>
            <button class="btn" id="pause">Pause</button>
            <button class="btn" id="reset">Reset</button>
        </div>
    </div>
    <script src="./index.js"></script>
</body>
</html>
